(function(){

`<div><div class="u">Unit ${q.u+1}: ${U[q.u]} · Question ${i+1} of 50</div>${ctx}<p class="qt">${q.q}</p>${q.o.map((t,j)=>{const c=pr&&a!=null?(j===q.k?"ok":j===a?"no":""):(a===j?"sel":"");return `<button class="o ${c}" data-o="${j}" ${pr&&a!=null?"disabled":""}><b>${"ABCD"[j]}</b><span>${t}</span></button>`}).join("")}${pr&&a!=null?`<p class="ex"><b>${a===q.k?"Correct.":"Not quite."}</b> ${q.e}</p>`:""}<div class="act"><button class="btn" data-act="prev" ${i?"":"disabled"}>Previous</button><button class="btn" data-act="clear">Clear response</button><button class="btn" data-act="mark">${S.r[i]?"Unmark review":"Mark for review"} &amp; next</button><button class="btn p" data-act="next">Save &amp; next</button></div></div>`;

function render(){if(!S||!S.on)return home();if(S.done)return result();exam()}

home();

})();
